<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D DND Dungeon Crawler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Load Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
    <!-- Game HUD -->
    <div id="hud">
        <div class="hud-panel top-left">
            <h2>⚔️ DND Dungeon</h2>
            <div class="stat-row">
                <span class="stat-label">❤️ Health:</span>
                <div class="health-container">
                    <div id="health-bar" class="health-bar"></div>
                    <span id="health" class="stat-value">100</span>
                </div>
            </div>
            <div class="stat-row">
                <span class="stat-label">⭐ Score:</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">💰 Gold:</span>
                <span id="gold" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">💀 Kills:</span>
                <span id="kills" class="stat-value">0</span>
            </div>
        </div>

        <div class="hud-panel bottom-center">
            <div class="controls-hint">
                <strong>Controls:</strong><br>
                <kbd>W A S D</kbd> - Move<br>
                <kbd>Mouse</kbd> - Look Around<br>
                <kbd>E</kbd> - Interact with Chests<br>
                <kbd>Space</kbd> - Attack Enemies<br>
                <em>Click to start!</em>
            </div>
        </div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair">
        <div class="crosshair-line horizontal"></div>
        <div class="crosshair-line vertical"></div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>🐉 3D DND Dungeon Crawler</h1>
            <div class="loading-spinner"></div>
            <p id="loading-text">Preparing your adventure...</p>
            <button id="start-button" style="display:none; padding: 15px 40px; font-size: 24px; background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%); color: #FFD700; border: 3px solid #FFD700; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);">
                ⚔️ START GAME ⚔️
            </button>
            <p class="loading-tip">Tip: Collect gold from chests and defeat enemies!</p>
        </div>
    </div>

    <!-- Game Script -->
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>

    <script>
        // Check if THREE.js is loaded and show start button
        window.addEventListener('load', () => {
            const loadingText = document.getElementById('loading-text');
            const startButton = document.getElementById('start-button');
            const loadingScreen = document.getElementById('loading-screen');
            const spinner = document.querySelector('.loading-spinner');

            // Check if THREE is available
            if (typeof THREE !== 'undefined') {
                // THREE.js loaded successfully
                setTimeout(() => {
                    spinner.style.display = 'none';
                    loadingText.textContent = 'Ready to play!';
                    startButton.style.display = 'block';

                    // Start button click handler
                    startButton.addEventListener('click', () => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 500);
                    });
                }, 1000);
            } else {
                // THREE.js failed to load
                spinner.style.display = 'none';
                loadingText.textContent = 'Error loading game. Please refresh the page.';
                loadingText.style.color = '#ff0000';
            }
        });
    </script>
</body>
</html>
